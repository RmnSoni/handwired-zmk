# Increase debounce period to reduce noise from direct wired switches
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Enable deep sleep for power saving (useful for battery powered builds)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Bluetooth settings
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB Logging (uncomment for debugging)
# CONFIG_ZMK_USB_LOGGING=y